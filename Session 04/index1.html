<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 500px; height: 200px; border:1px solid #000;
            padding: 6px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <input type="text" id="usr_inp" placeholder="Enter text" onkeyup="copyText()" />
    <div class="box" id="div1"></div>
    <script>
        function copyText(){
            let data = document.getElementById("usr_inp").value
            document.querySelector("#div1").innerHTML = data
        }
    </script>
</body>
</html>
