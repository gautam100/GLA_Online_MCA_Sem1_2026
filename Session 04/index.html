<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript - First prog</title>
</head>
<body>
    <div id="div1">..</div>
    <button onclick="xyz()">Click Me!</button>
    <script>
        /*Named function*/
        function xyz(){
            //alert("Hello World!")
            document.getElementById("div1").style.color = "red";
            document.getElementById("div1").innerHTML = "<h1>Hello World</h1>"
        }
    </script>
</body>
</html>
