<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Box Model</title>
    <style>
      .top-header {
        width: 1460px;
        height: 136px;
        border: 1px solid #000;
        margin: 10px 12px 5px 15px;
        padding: 6px 10px 15px;
        /* float:left; */
      }
      .logo{
        width: 200px;
        height: 110px;
        border: 0px solid #000;
        margin: 10px;
        float:left;
      }
      .header-center{
        width: 600px;
        height: 110px;
        border: 1px solid #000;
        margin: 10px;
        float: left;
      }
      .content-area{
        width: 1460px;
        height: 436px;
        border: 1px solid #000;
        margin: 10px 12px 5px 15px;
        padding: 6px 10px 15px;
      }
    </style>
  </head>
  <body>
    <header class="top-header">
        <div class="logo">
            <img src="logo.png" width="190" height="100" />
        </div>
        <div class="header-center">
        <h1>This is header section</h1>
        </div>
    </header>
    
    <div class="content-area">

    </div>
    
  </body>
</html>
